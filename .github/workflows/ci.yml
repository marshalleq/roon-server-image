name: CI

# Called by build.yml, so nothing is published unless this passes.
# The single required check is the job named "ci" (shown as "ci / ci"); keep that name stable,
# because branch protection refers to it.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint workflow files
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -ignore 'SC2046'

      - name: Check shell scripts
        run: docker run --rm -v "$PWD":/repo -w /repo koalaman/shellcheck:v0.10.0 run.sh .github/scripts/test-entrypoint.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The weekly scheduled run starts from nothing so Debian's newest security fixes are picked up.
      # The publish job reads this cache, so it publishes exactly the image that was tested and scanned.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: roon-server-image:ci
          provenance: false
          cache-from: type=gha,scope=roon-server-image
          cache-to: type=gha,mode=max,scope=roon-server-image
          no-cache: ${{ github.event_name == 'schedule' }}

      - name: Test the entrypoint
        run: .github/scripts/test-entrypoint.sh roon-server-image:ci

      # Third-party action pinned to a full commit (v0.36.0, an immutable release), because Trivy's
      # own action was compromised in March 2026. Dependabot keeps the pin current.
      - name: Report HIGH and CRITICAL findings (information only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: roon-server-image:ci
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'

      # The gate: fail if any critical finding has a fix available. If the vulnerability database
      # cannot be downloaded this step fails too, rather than reporting "all clear".
      - name: Fail on fixable CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: roon-server-image:ci
          version: v0.76.2
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
